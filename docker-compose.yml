# PostgreSQL local para desarrollo y pruebas (credenciales solo de desarrollo local).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: restosistem
      POSTGRES_PASSWORD: restosistem
      POSTGRES_DB: restosistem
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
      - restosistem_pgdata:/var/lib/postgresql/data
volumes:
  restosistem_pgdata:
